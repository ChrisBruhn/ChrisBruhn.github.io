  <h1>Om Julius</h1>
  <h2>Julius er desværre død. Han døde sidste efterår efter at han var ramt af en bil.</h2>
  <img src="julius2banner.jpg" alt="">
  <p>Jeg ved ikke så meget om Julius. Jeg fik ham af en gammel dame som ikke ville have ham mere. Han var opvokset som indekat og viste derfor ikke rigtig hvordan man skulle opføre sig som kat.</p>
